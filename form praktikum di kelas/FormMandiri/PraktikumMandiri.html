<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <center>
  <fieldset style="display: inlinecent;">
    <a href="#">Home</a> |
    <a href="#">Register</a> |
    <a href="#">Policy</a> |
    <a href="#">About</a>
  </fieldset>
</center>
  <div style="display: flex; gap: 20px; align-items: flex-start;">
  <div style="width: 200px; text-align: center;">
    <div style="border: 1px solid #f0f0f0; height: 200px; display: flex; align-items: center; justify-content: center; background: #eee; margin-bottom: 5px;">
      <span style="font-size: 40px; color: #888;">X</span>
    </div>
    <input type="file" id="upload" style="display: none;">
    <label for="upload" style="display: inline-block; padding: 5px 10px; background: #d900f6; color: white; border: 1px solid #bbb; cursor: pointer;">
      Upload Picture
    </label>
  </div>

  <div style="flex-grow: 1;">
      <p>
        <label for="namabarang">Nama Barang:</label>
        <input type="text" id="namabarang" name="namabarang" required>
     </p>
     <p>
        <label for="delivery">Informasi Barang:</label><br>
        <textarea id="delivery" name="delivery" rows="4" cols="50" maxlength="400" placeholder="Masukkan informasi barang"></textarea>
    </p>
  <label for="phone">Nomor Handphone:</label>
  <input 
    type="text" 
    id="phone" 
    name="phone" 
    inputmode="numeric" 
    placeholder="Contoh: 0856-9705-7811" 
    pattern="[0-9\-]*" 
    title="Hanya boleh diisi angka dan tanda hubung (-)"
  >
  <p>
     <label for="quantity">Bank :</label>
    <select id="quantity" name="quantity" required>
        <option value="">Pilih Bank Anda</option>
        <option value="BANK BCA">BANK BCA</option>
        <option value="BANK BNI">BANK BNI</option>
        <option value="BANK BRI">BANK BRI</option>
        <option value="BANK Mandiri">BANK Mandiri</option>
        <option value="SEABANK">SEABANK</option>
    </select>
 </p>
 <p><input type="text" id="namapengguna" name="namapengguna" placeholder="Masukkan nama pengguna" required></p>
  <p><input type="number" inputmode="numeric" min="0" max="100" placeholder="Masukkan jumlah"></p>
  <!-- Checkbox Opsi -->
    <div style="margin-top: 10px;">
      <label><input type="checkbox" checked> Send to Mobile Phone</label><br>
      <label><input type="checkbox" checked> Send to Email</label>
    </div>

               
      <table style="width: 100%; margin-top: 15px; border-spacing: 0 8px;">
          <tr>
            <td style="width: 150px;">Send to Mobile Phone</td>
            <td>
                <input type="text" name="send_phone" inputmode="numeric" placeholder="Contoh: 85697057811,3`123014124123" style="width: 100%;">
            </td>
          </tr>
          <tr>
          <td>Send to Email</td>
            <td>
             <input type="text" name="send_email" placeholder="Contoh: mfmmig13@aston.ac.uk, fyx_06@yahoo.com" style="width: 100%;">
            </td>
          </tr>
        </table>

     </div>
  </div>

        <!-- Tombol Aksi di Bagian Akhir -->
  <div style="text-align: center; margin-top: 30px;">
      <button type="submit" style="background-color: #e300fc; color: white; padding: 10px 30px; font-weight: bold; border: none; cursor: pointer;">
         Generate Nobr Link
      </button>
    </div>
  </div>
 
</body>
</html>
