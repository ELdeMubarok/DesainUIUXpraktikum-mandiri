<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <center>
  <fieldset>
    <a href="PraktikumMandiri.html">Home</a> |
    <a href="hasil.html">Generate Link</a> |
    <a href="#">Transaction History</a> |
    <a href="#">Policy</a> |
    <a href="#">Logout</a>
  </fieldset>
  </center>
  <div>
  <div>
    <input type="file" id="upload">
    <label for="upload">
      Upload Picture
    </label>
  </div>

  <div>
      <p>
        <label for="namabarang">Nama Barang:</label>
        <input type="text" id="namabarang" name="namabarang" required>
     </p>
     <p>
        <label for="delivery">Informasi Barang:</label><br>
        <textarea id="delivery" name="delivery" rows="4" cols="50" maxlength="400" placeholder="Masukkan informasi barang"></textarea>
    </p>
  <label for="phone">Nomor Handphone:</label>
  <input 
    type="text" 
    id="phone" 
    name="phone" 
    inputmode="numeric" 
    placeholder="Contoh: 0856-9705-7811" 
    pattern="[0-9\-]*" 
    title="Hanya boleh diisi angka dan tanda hubung (-)"
  >
  <p>
     <label for="quantity">Bank :</label>
    <select id="quantity" name="quantity" required>
        <option value="">Pilih Bank Anda</option>
        <option value="BANK BCA">BANK BCA</option>
        <option value="BANK BNI">BANK BNI</option>
        <option value="BANK BRI">BANK BRI</option>
        <option value="BANK Mandiri">BANK Mandiri</option>
        <option value="SEABANK">SEABANK</option>
    </select>
 </p>
 <p><input type="text" id="namapengguna" name="namapengguna" placeholder="Masukkan nama pengguna" required></p>
  <p><input type="number" inputmode="numeric" min="0" max="100" placeholder="Masukkan jumlah"></p>
  <!-- Checkbox Opsi -->
    <div>
      <label><input type="checkbox" checked> Send to Mobile Phone</label><br>
      <label><input type="checkbox" checked> Send to Email</label>
    </div>

               
      <table>
          <tr>
            <td>Send to Mobile Phone</td>
            <td>
                <input type="text" name="send_phone" inputmode="numeric" placeholder="Contoh: 85697057811,3`123014124123">
            </td>
          </tr>
          <tr>
          <td>Send to Email</td>
            <td>
             <input type="text" name="send_email" placeholder="Contoh: mfmmig13@aston.ac.uk, fyx_06@yahoo.com">
            </td>
          </tr>
        </table>

     </div>
  </div>
  <div>
      <button type="submit">
         <a href="hasil.html">Generate Panda Link</a>
      </button>
    </div>
  </div>
 
</body>
</html>
