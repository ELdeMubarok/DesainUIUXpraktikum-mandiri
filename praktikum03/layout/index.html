<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        html,body{
            width: 100%;
            height: 100%;
            background-color: #8d00f2;
        }

        .wrapper{
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 10px;
        }

        header{
            background-color:azure;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight:bold;
            border: 1px solid;
        }

        nav{
            background-color: aqua;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid; 
        }

        .main-content{
            display: flex;
            gap: 10px;
            flex: 1;
        }

        article{
            flex: 3;
            background-color:#f2f2f2;
            padding: 15px;
            border: 1px solid;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        section{
            background-color: white;
            padding: 10px;
            border: 1px solid;
            flex: 1;
            display: flex;
            align-items: center;
        }

        aside{
            flex: 1;
            background-color: #f2f2f2;
            padding: 15px;
            border: 1px solid;
        }

        footer{
            background-color:antiquewhite;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border: 1px solid;
        }

    </style>
</head>
<body>
    <div class="wrapper" >
        <header>
            <img src="/praktikum03/layout/hadidd.jpeg" alt="Gambar Hadid Ngetik" width="150px">
            <p>ini website ku</p>
        </header>
        
        <nav>
            nav
        </nav>
        
        <div class="main-content">
            <article>
                article
                <section>set</section>
                <section></section>
                <section></section>
            </article>

            <aside>
                aside
            </aside>
        </div>

        <footer>
            footer
        </footer>
    </div>
</body>
</html>
